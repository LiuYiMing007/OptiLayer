name: Cross-platform verification and releases
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        id: rust-build-cache
        with:
          path: src-tauri/target
          key: tfc-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ hashFiles('src-tauri/src/**', 'src-tauri/build.rs', 'src-tauri/tauri*.json') }}
          restore-keys: |
            tfc-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
            tfc-rust-${{ runner.os }}-${{ runner.arch }}-

      - run: python -m venv .venv
      - run: node scripts/run_python.mjs -m pip install -r engine/requirements-dev.txt
      - run: npm ci
      - run: npm test
      - run: npm run validate:optics
      - run: npm run build
      - name: Build and check mobile viewing framework
        run: npm run mobile:build && node scripts/check_mobile_build.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: mobile-framework-preview
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if('v'+JSON.parse(require('fs').readFileSync('package.json','utf8')).version!==process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm run engine:bundle
      - run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --no-bundle
      - if: runner.os == 'macOS'
        run: npm run tauri -- bundle --config src-tauri/tauri.release.conf.json --bundles app
      - uses: actions/cache/save@v4
        if: steps.rust-build-cache.outputs.cache-hit != 'true'
        with:
          path: src-tauri/target
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}
      - run: node scripts/run_python.mjs scripts/stage_release.py
      - name: Seal and verify macOS application
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - release/TFC.app
          codesign --verify --deep --strict release/TFC.app
      - run: node scripts/run_python.mjs scripts/validate_menu_release.py
      - run: node scripts/run_python.mjs scripts/validate_window_ipc_release.py
      - run: node scripts/run_python.mjs scripts/validate_catalogue_release.py
      - run: node scripts/run_python.mjs scripts/validate_tfd_release.py
      - run: node scripts/run_python.mjs scripts/validate_environment_release.py
      - run: node scripts/run_python.mjs scripts/validate_workspace_release.py
      - run: node scripts/run_python.mjs scripts/validate_workspace_folders_release.py
      - run: node scripts/run_python.mjs scripts/package_release.py
      - run: node scripts/run_python.mjs scripts/validate_portable_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: checks-${{ runner.os }}
          path: release/checks/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/assets/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish a new immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/更新报告/${TAG#v}更新报告.md"
          test -f "$NOTES"
          python scripts/package_combined_release.py --assets release-assets --version "${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its verified assets."
          else
            python scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" release-assets/* --verify-tag --title "TFC $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: combined-release
          path: release-assets/*macOS-Windows*
          if-no-files-found: error
          retention-days: 30
