name: Cross-platform verification and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv .venv
      - run: node scripts/run_python.mjs -m pip install -r engine/requirements-dev.txt
      - run: npm ci
      - run: npm test
      - run: npm run validate:optics
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if('v'+JSON.parse(require('fs').readFileSync('package.json','utf8')).version!==process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm run engine:bundle
      - run: npm run tauri -- build --config src-tauri/tauri.release.conf.json --no-bundle
      - if: runner.os == 'macOS'
        run: npm run tauri -- bundle --config src-tauri/tauri.release.conf.json --bundles app
      - run: node scripts/run_python.mjs scripts/stage_release.py
      - run: node scripts/run_python.mjs scripts/validate_menu_release.py
      - run: node scripts/run_python.mjs scripts/validate_workspace_release.py
      - run: node scripts/run_python.mjs scripts/package_release.py
      - run: node scripts/run_python.mjs scripts/validate_portable_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: checks-${{ runner.os }}
          path: release/checks/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/assets/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish a new immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="docs/更新报告/${TAG#v}更新报告.md"
          test -f "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its verified assets."
          else
            python scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" release-assets/* --verify-tag --title "TFC $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
